name: Build and type check

on:
  push:
    branches:
      - feature/complete-deals-and-alerts-20261012
  pull_request:
    branches:
      - main
      - feature/local-current-source-20261012

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Type check
        run: npm run type-check
      - name: Production build
        run: npm run build
